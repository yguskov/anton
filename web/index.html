<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>HR</title>
  <link rel="manifest" href="manifest.json">

          <style>
        /* Лоадер - на всю страницу */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loader-wrapper.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* SVG крутилка */
        .loader-svg {
            width: 80px;
            height: 80px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.7; }
        }
        
        /* Три точки под крутилкой */
        .loader-dots {
            display: flex;
            gap: 8px;
            margin-top: 30px;
        }
        
        .loader-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3498db;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loader-dot:nth-child(1) { animation-delay: -0.32s; }
        .loader-dot:nth-child(2) { animation-delay: -0.16s; }
        .loader-dot:nth-child(3) { animation-delay: 0s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Текст под точками */
        .loader-text {
            margin-top: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #666;
            font-size: 14px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

      <!-- Loader -->
    <div id="loader-wrapper" class="loader-wrapper">
        <!-- SVG ring -->
        <svg class="loader-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#3498db" stroke-width="6">
                <animate attributeName="stroke-dasharray" 
                    from="0 251.2" to="251.2 0" dur="2s" repeatCount="indefinite"/>
                <animateTransform attributeName="transform" type="rotate"
                    from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite"/>
            </circle>
        </svg>
        
        <div class="loader-dots">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
        </div>
        
        <div class="loader-text" id="loader-text">Загрузка ...</div>
    </div>

    <div id="app"></div>

  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    window.flutterWebRenderer = "html";
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for registration to finish before dropping the <script> tag.
        // Otherwise, the browser will load the script multiple times,
        // potentially different versions.
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              // No active web worker and we have installed or are installing
              // one for the first time. Simply wait for it to activate.
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              // When the app updates the serviceWorkerVersion changes, so we
              // need to ask the service worker to update.
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              // Existing service worker is still good.
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        // If service worker doesn't succeed in a reasonable amount of time,
        // fallback to plaint <script> tag.
        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              'Failed to load app from service worker. Falling back to plain <script> tag.',
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      // Service workers not supported. Just drop the <script> tag.
      loadMainDartJs();
    }
  </script>

    <script>
        // hide loader
        window.addEventListener('load', () => {
            const loaderWrapper = document.getElementById('loader-wrapper');
            const loaderText = document.getElementById('loader-text');
            
            // loaderText.textContent = 'Готово!';
            
            setTimeout(() => {
                loaderWrapper.classList.add('hidden');
                setTimeout(() => {
                    loaderWrapper.remove();
                }, 500);
            }, 300);
        });
        
        window.addEventListener('error', (e) => {
            if (e.target.tagName === 'SCRIPT') {
                const loaderText = document.getElementById('loader-text');
                loaderText.textContent = '❌ Ошибка загрузки. Обновите страницу.';
                loaderText.style.color = 'red';
            }
        });
    </script>  

</body>
</html>
